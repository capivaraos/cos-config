# Flatpak manifest for Flathub.
#
# Python + PyGObject (GTK4/libadwaita/pycairo all ship in the GNOME runtime)
# plus gtk4-layer-shell, bundled so the optional "pin to desktop" widget can
# anchor to the background where the compositor supports layer-shell.
#
# This is the exact manifest submitted to Flathub (reproducible git source).
# For local testing against your working tree, temporarily swap the
# cos-config `git` source for:  {type: dir, path: ../..}
#   flatpak-builder --user --install --force-clean build-dir \
#       build-aux/flatpak/org.capivaraos.Config.yml
id: org.capivaraos.Config
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cos-config

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Let the user save the shared card into Downloads.
  - --filesystem=xdg-download
  # No host filesystem access needed: distro is read from /run/host/os-release
  # (exposed by Flatpak), CPU/memory/uptime from /proc, and the GPU via lspci
  # over /sys/bus/pci — all available in the default sandbox.

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  - name: cos-config
    buildsystem: meson
    config-opts:
      - -Dnative=false
    sources:
      - type: git
        url: https://github.com/capivaraos/cos-config.git
        tag: v0.3.0
        commit: 2ebf6f36ebde54e52c19e43b151b95296b82abb3
